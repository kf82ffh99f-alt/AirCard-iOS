name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16+
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          fi
          echo "Selected Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Install dependencies
        run: |
          brew install xcodegen
          rustup target add aarch64-apple-ios

      - name: Generate Xcode Project
        run: |
          xcodegen generate || true

      - name: Build and Package Unsigned IPA
        run: |
          # Detect the exact scheme name automatically
          SCHEME=$(xcodebuild -list -json | tr -d '\n' | sed -n 's/.*"schemes":\[\([^]]*\)\].*/\1/p' | awk -F'"' '{print $2}')
          if [ -z "$SCHEME" ]; then
            SCHEME="AirCard-iOS"
          fi
          echo "Building scheme: $SCHEME"

          xcodebuild clean archive \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            -archivePath "build/AirCard.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          mkdir -p build/Payload
          cp -r build/AirCard.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -qr AirCard-iOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirCard-iOS-IPA
          path: build/AirCard-iOS.ipa

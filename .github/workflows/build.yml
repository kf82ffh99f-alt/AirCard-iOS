name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16+
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          fi
          echo "Selected Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> $GITHUB_ENV

      - name: Install dependencies & Rust targets
        run: |
          brew install xcodegen
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Build Rust FFI and AirliftFFI.xcframework
        run: |
          chmod +x build-ios.sh
          ./build-ios.sh

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build and Package Unsigned IPA
        run: |
          # Patch build-ipa.sh to disable mandatory signing requirements
          sed -i '' 's/CODE_SIGNING_REQUIRED=YES/CODE_SIGNING_REQUIRED=NO/g' build-ipa.sh 2>/dev/null || true
          sed -i '' 's/CODE_SIGN_IDENTITY=.*/CODE_SIGN_IDENTITY=""/g' build-ipa.sh 2>/dev/null || true

          export CODE_SIGNING_ALLOWED=NO
          export CODE_SIGNING_REQUIRED=NO
          export CODE_SIGN_IDENTITY=""
          export AD_HOC_CODE_SIGNING_ALLOWED=YES

          chmod +x build-ipa.sh
          ./build-ipa.sh || {
            echo "Packaging from generated app..."
            mkdir -p build/Payload
            cp -r build/Build/Products/Release-iphoneos/*.app build/Payload/ 2>/dev/null || \
            cp -r build/DerivedData/Build/Products/Release-iphoneos/*.app build/Payload/ 2>/dev/null || true
            cd build
            zip -qr AirCard-iOS.ipa Payload
          }

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirCard-iOS-IPA
          path: |
            build/*.ipa
            *.ipa

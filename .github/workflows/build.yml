name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16+
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          fi
          echo "Selected Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Install dependencies & Rust targets
        run: |
          brew install xcodegen
          rustup target add aarch64-apple-ios x86_64-apple-ios aarch64-apple-ios-sim
          cargo install cargo-swift 2>/dev/null || true

      - name: Build Rust XCFramework
        run: |
          # Look for existing build script for Airlift / FFI
          if [ -f "./build-framework.sh" ]; then
            chmod +x ./build-framework.sh
            ./build-framework.sh
          elif [ -f "./build-rust.sh" ]; then
            chmod +x ./build-rust.sh
            ./build-rust.sh
          elif [ -d "airlift" ] || [ -d "rust" ]; then
            cd airlift 2>/dev/null || cd rust 2>/dev/null
            cargo build --release --target aarch64-apple-ios
            cd -
          fi

          # If build-ipa.sh has rust build instructions, run them manually
          bash -n build-ipa.sh || true

      - name: Generate Xcode Project
        run: |
          xcodegen generate || true

      - name: Build and Package Unsigned IPA
        run: |
          # Disable code signing in the build script
          sed -i '' 's/CODE_SIGNING_REQUIRED=YES/CODE_SIGNING_REQUIRED=NO/g' build-ipa.sh 2>/dev/null || true
          sed -i '' 's/CODE_SIGN_IDENTITY=.*/CODE_SIGN_IDENTITY=""/g' build-ipa.sh 2>/dev/null || true
          sed -i '' 's/xcodebuild clean build/xcodebuild clean build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""/g' build-ipa.sh 2>/dev/null || true
          sed -i '' 's/xcodebuild clean archive/xcodebuild clean archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""/g' build-ipa.sh 2>/dev/null || true

          export CODE_SIGNING_ALLOWED=NO
          export CODE_SIGNING_REQUIRED=NO
          export CODE_SIGN_IDENTITY=""
          export AD_HOC_CODE_SIGNING_ALLOWED=YES

          chmod +x build-ipa.sh
          ./build-ipa.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirCard-iOS-IPA
          path: |
            build/*.ipa
            *.ipa

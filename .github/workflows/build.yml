name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16+
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          fi
          echo "Selected Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Install dependencies
        run: |
          brew install xcodegen
          rustup target add aarch64-apple-ios

      - name: Run Build Script Without Signing
        run: |
          chmod +x build-ipa.sh

          # Patch build-ipa.sh to disable mandatory codesigning requirements
          sed -i '' 's/CODE_SIGNING_REQUIRED=YES/CODE_SIGNING_REQUIRED=NO/g' build-ipa.sh || true
          sed -i '' 's/CODE_SIGN_IDENTITY=.*/CODE_SIGN_IDENTITY=""/g' build-ipa.sh || true
          sed -i '' 's/-exportArchive/-exportArchive -allowProvisioningUpdates/g' build-ipa.sh || true

          # Set environment overrides
          export CODE_SIGNING_ALLOWED=NO
          export CODE_SIGNING_REQUIRED=NO
          export CODE_SIGN_IDENTITY=""
          export AD_HOC_CODE_SIGNING_ALLOWED=YES

          # Run the script to generate AirliftFFI and compile
          ./build-ipa.sh || {
            echo "Direct export failed; packing from generated archive..."
            ARCHIVE_PATH=$(find . -name "*.xcarchive" | head -n 1)
            mkdir -p build/Payload
            cp -r "$ARCHIVE_PATH/Products/Applications/"*.app build/Payload/
            cd build
            zip -qr AirCard-iOS.ipa Payload
          }

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirCard-iOS-IPA
          path: |
            build/*.ipa
            *.ipa
